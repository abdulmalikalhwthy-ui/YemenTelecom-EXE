name: Build Windows EXE
on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build EXE
      run: |
        pyinstaller --noconsole --onefile --add-data "*.png;." --add-data "*.jpg;." --add-data "*.ttf;." windows_app.py

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: Yemen-Telecom-App
        path: dist/*.exe
